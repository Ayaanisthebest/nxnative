<style>

<script>
var C=['#ff5a5f','#3fa7ff','#ffcf3f','#3ddc84','#c77dff','#ff8c42','#2ee6d6','#ff6fb5'];

var M=32767,ws=null,last='',prev=0,touches={},sticks=[[0,0],[0,0]],autoGas=false,pulse=0;

var U=window.CSS&&CSS.supports&&CSS.supports('height','1dvh')?'dvh':'vh';
var ring=$('#ring');

 var h=document.querySelector('#steer .hint');if(h)h.textContent=tilt?'TILT':'STEER';releaseAll();}
function tiltMark(){$('#tilt').classList.toggle('on',tilt);var h=document.querySelector('#steer .hint');if(h)h.textContent=tilt?'TILT':'STEER';}

 document.querySelectorAll('.stick,#steer').forEach(function(s){s.classList.remove('act');});ring.style.display='none';send(true);}
function setPlayer(p){var pb=$('#pb'),take=$('#take');if(p<1){pb.textContent='Full';take.hidden=true;document.documentElement.style.setProperty('--pc','#555a66');return;}
 pb.textContent='P'+p;take.hidden=p==1;var c=C[(p-1)%8];document.documentElement.style.setProperty('--pc',c);document.documentElement.style.setProperty('--pcs',c+'66');}
function connect(){
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=function(){$('#ms').textContent='connected';ws.send('n '+id);if(nick)ws.send('m '+nick);last='';send(true);};
 ws.onmessage=function(e){var m=e.data.split(' ');if(m[0]=='p')setPlayer(+m[1]);
  if(m[0]=='t'){var rtt=performance.now()-(+m[1]);ws.send('r '+rtt.toFixed(1));$('#ms').textContent=rtt.toFixed(0)+' ms';}
  if(m[0]=='h'){rum=+m[1];rumAt=performance.now();}};
 ws.onclose=function(){$('#ms').textContent='reconnecting';$('#pb').textContent='\u2026';setTimeout(connect,400);};
}
function dpadBits(h,t){var r=h.el.getBoundingClientRect(),x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2;if(Math.hypot(x,y)<r.width*0.12)return 0;
 var a=Math.atan2(-y,x)*180/Math.PI,b=0;if(a>-67.5&&a<67.5)b|=1<<14;if(a>22.5&&a<157.5)b|=1<<13;if(a>112.5||a<-112.5)b|=1<<12;if(a<-22.5&&a>-157.5)b|=1<<15;return b;}
var SHAPE={pro:{dz:.07,sat:.9,ad:0,exp:1},kart:{dz:.05,sat:.9,ad:0,exp:1.35},smash:{dz:.07,sat:.88,ad:.16,exp:1}};
function shape(x,y){var p=SHAPE[lay]||SHAPE.pro,d=Math.hypot(x,y);if(d<p.dz)return[0,0];
 var m=Math.pow(Math.min(1,(d-p.dz)/(p.sat-p.dz)),p.exp);m=p.ad+(1-p.ad)*m;return[x/d*m,y/d*m];}
function stickAt(h,t){var r=h.el.getBoundingClientRect(),rel=h.f||h.el.dataset.m=='dyn',R=h.f?Math.min(r.width,r.height)*0.2:r.width/2;
 var x=(t.clientX-(rel?h.ox:r.left+r.width/2))/R,y=(t.clientY-(rel?h.oy:r.top+r.height/2))/R,d=Math.hypot(x,y);
 if(d>1){if(rel){h.ox=t.clientX-x/d*R;h.oy=t.clientY-y/d*R;}x/=d;y/=d;}
 var o=shape(x,-y),full=Math.hypot(o[0],o[1])>.99;if(full&&!h.full&&navigator.vibrate)navigator.vibrate(6);h.full=full;
 sticks[h.s]=o;h.el.classList.add('act');
 if(h.f){ring.style.margin='0';ring.style.display='block';ring.style.width=ring.style.height=(2*R)+'px';ring.style.left=(h.ox-r.left-R)+'px';ring.style.top=(h.oy-r.top-R)+'px';
  ring.firstChild.style.transform='translate('+(x*R*0.75)+'px,'+(y*R*0.75)+'px)';}
 else h.el.firstChild.style.transform='translate('+(x*R*0.6)+'px,'+(y*R*0.6)+'px)';}
function stickOff(h){sticks[h.s]=[0,0];h.el.classList.remove('act');if(h.f)ring.style.display='none';else h.el.firstChild.style.transform='';}
function hit(t){var e=document.elementFromPoint(t.clientX,t.clientY);if(!e)return null;
 var dt=e.closest('[data-t]');if(dt)return dt.dataset.t=='short'?{t:'short',b:+dt.dataset.pulseB}:{t:'auto'};
 var s=e.closest('[data-s]');if(s&&s.id=='steer'&&tilt&&listening)return null;
 if(s)return{s:+s.dataset.s,el:s,f:s.classList.contains('float'),ox:t.clientX,oy:t.clientY};
 var d=e.closest('.dpad');if(d)return{d:1,el:d,bits:0};
 var b=e.closest('[data-b]');if(b)return{b:+b.dataset.b};
 s=nearStick(t);return s?{s:+s.dataset.s,el:s,f:false,ox:t.clientX,oy:t.clientY}:null;}
function nearStick(t){var best=null,bd=1.45;document.querySelectorAll('#'+lay+' .stick').forEach(function(s){var r=s.getBoundingClientRect(),R=r.width/2,

function bits(){var m=(autoGas?1:0)|pulse;for(var k in touches){var h=touches[k];if(!h)continue;if(h.b!=null)m|=1<<h.b;if(h.d)m|=h.bits;}return m;}

function paint(m){document.querySelectorAll('[data-b]').forEach(function(e){e.classList.toggle('on',!!(m>>e.dataset.b&1));});
 var dirs=[13,15,12,14];document.querySelectorAll('.dpad').forEach(function(d){var is=d.querySelectorAll('i');for(var j=0;j<4;j++)is[j].classList.toggle('on',!!(m>>dirs[j]&1));});}

 var s='s '+m+' '+q(sticks[0][0])+' '+q(sticks[0][1])+' '+q(sticks[1][0])+' '+q(sticks[1][1]);
 if(tilt&&gyro)s+=' '+gyro.map(function(n){return n.toFixed(3);}).join(' ');
 var go=(force||s!=last)&&ws&&ws.readyState==1;
 if(go&&ws.bufferedAmount>2048){go=false;if(!retry){retry=true;setTimeout(function(){retry=false;send(true);},8);}}

 var rose=m&~prev;if(rose&&navigator.vibrate)navigator.vibrate(rose&(1|1<<1|1<<7)?28:14);
 prev=m;paintM=m;if(!paintOn){paintOn=true;requestAnimationFrame(function(){paintOn=false;paint(paintM);});}}
var haveGrav=false,asking=false;
function fingerSteer(){for(var k in touches){var h=touches[k];if(h&&h.s===0)return true;}return false;}
function screenAngle(){var w=window.orientation;if(typeof w=='number')return w;if(screen.orientation&&typeof screen.orientation.angle=='number')return screen.orientation.angle;return 0;}
function steer(raw){if(fingerSteer()||raw==null||lay!='kart')return;if(tiltZero==null)tiltZero=raw;var d=raw-tiltZero;if(d>180)d-=360;if(d<-180)d+=360;
 if(Math.abs(d)<2)d=0;else d=d>0?d-2:d+2;sticks[0][0]=Math.max(-1,Math.min(1,d/32));sticks[0][1]=0;}
function tiltKnob(x){var ring=$('#ring');if(!tilt||lay!='kart'||fingerSteer()){if(!fingerSteer())ring.style.display='none';return;}
 ring.style.display='block';ring.style.left='50%';ring.style.top='50%';ring.style.width='26'+U;ring.style.height='26'+U;ring.style.margin='-13'+U+' 0 0 -13'+U;
 ring.firstChild.style.transform='translate('+(x*8)+U+',0)';}
function wheelOf(g){return -Math.atan2(-g.x,-g.y)*180/Math.PI;}

 if(o===270||o===-90)raw=e.beta==null?null:-e.beta;else if(o!==90&&o!==-270)raw=e.gamma;if(raw==null)return;steer(raw);tiltKnob(sticks[0][0]);noteMotion();}

 var k=Math.PI/180,scale=Math.hypot(g.x,g.y,g.z)>4?9.80665:1;
 gyro=[g.x/scale,g.y/scale,g.z/scale,r&&r.beta!=null?r.beta*k:0,r&&r.gamma!=null?r.gamma*k:0,r&&r.alpha!=null?r.alpha*k:0];

  if(plane>all*0.2){haveGrav=true;steer(wheelOf(g));}else sticks[0][0]=0;tiltKnob(sticks[0][0]);}

function noteMotion(){var now=performance.now();if(now-lastSend<16)return;lastSend=now;send();}

function startMotion(){if(listening)return;var ask=window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission=='function';
 if(!ask){listenMotion();return;}

 var pend=DeviceMotionEvent.requestPermission();
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission=='function'){var o=DeviceOrientationEvent.requestPermission();if(o&&o.catch)o.catch(function(){});}

  if(h&&h.s!=null){stickAt(h,t);continue;}if(h&&h.d){h.bits=dpadBits(h,t);continue;}
  if(h&&h.b!=null)continue;   // a button stays down until the finger lifts, even after it slides off the button
  var n=hit(t);touches[t.identifier]=n&&n.b!=null?n:null;}
 send();}
function end(e){if(isUi(e))return;if(tilt&&!listening&&!asking){asking=true;startMotion();if(listening)asking=false;}var block=false;
 for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i],h=touches[t.identifier];if(!(h&&h.b!=null))block=true;if(h&&h.s!=null)stickOff(h);delete touches[t.identifier];}
 if(block)e.preventDefault();
 send();}
document.addEventListener('touchstart',start,{passive:false});document.addEventListener('touchmove',move,{passive:false});
document.addEventListener('touchend',end,{passive:false});document.addEventListener('touchcancel',end,{passive:false});

 if(tilt&&listening){tilt=false;localStorage.setItem('nxtilt','0');gyro=null;tiltZero=null;haveGrav=false;sticks[0][0]=0;tiltMark();tiltKnob(0);send(true);return;}
 asking=true;tilt=true;localStorage.setItem('nxtilt','1');tiltZero=null;gyro=null;haveGrav=false;
 tiltMark();startMotion();if(listening)asking=false;}
$('#tilt').addEventListener('touchend',armTilt);$('#tilt').addEventListener('click',armTilt);

 nick=v.replace(/\s+/g,' ').trim().slice(0,24);localStorage.setItem('nxnick',nick);showNick();if(ws&&ws.readyState==1)ws.send('m '+nick);});

showNick();setLayout(lay);tiltMark();
if(tilt&&!(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission))listenMotion();

setInterval(function(){if(performance.now()-rumAt>350)rum=0;if(rum>0.05&&navigator.vibrate)navigator.vibrate(Math.round(12+rum*36));},90);

connect();
